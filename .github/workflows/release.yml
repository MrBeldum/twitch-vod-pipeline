name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build release assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Compile the Windows host
        run: .\packaging\build.cmd
        shell: cmd

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
        shell: pwsh

      - name: Stage assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item VODPipeline.exe release/
          Copy-Item dist/* release/
          Get-FileHash release/* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content release/SHA256SUMS.txt -Encoding utf8
          Get-ChildItem release

      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$env:TAG" (Get-ChildItem release | ForEach-Object FullName) --clobber
        shell: pwsh
