name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Windows is the supported platform: the packaging, the app window and the file
    # locking are all exercised here. The suite runs real ffmpeg, so it takes minutes.
    name: tests (windows, py${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress --yes

      - name: Show versions
        run: |
          python --version
          ffmpeg -version | Select-Object -First 1
        shell: pwsh

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . --verbose
        shell: pwsh

  package:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  windows-host:
    name: compile VODPipeline.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Windows host
        run: .\packaging\build.cmd
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: VODPipeline-exe
          path: VODPipeline.exe
