name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Windows is the supported platform: the packaging, the app window and the file
    # locking are all exercised here. The suite runs real ffmpeg, so it takes minutes.
    name: tests (windows, py${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress --yes

      # Not optional: Pipeline.__init__ resolves streamlink up front and raises
      # without it, so the majority of the suite cannot even reach setUp.
      - name: Install streamlink
        run: python -m pip install --upgrade streamlink
        shell: pwsh

      - name: Show versions
        run: |
          python --version
          ffmpeg -version | Select-Object -First 1
          streamlink --version
        shell: pwsh

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . --verbose
        shell: pwsh

  tests-posix:
    # The same suite on the other two platforms: file locking is fcntl there,
    # the reveal/browser/tool-discovery seams take their POSIX branches, and
    # ffmpeg is a different build.
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg
          else sudo apt-get update && sudo apt-get install -y ffmpeg; fi

      - name: Install streamlink
        run: python -m pip install --upgrade streamlink

      # macOS's $TMPDIR is a symlink (/var -> /private/var); resolve it once so
      # a test comparing a resolved path with an unresolved one is not
      # comparing two spellings of the same directory.
      - name: Resolve TMPDIR
        run: echo "TMPDIR=$(python -c 'import os,tempfile;print(os.path.realpath(tempfile.gettempdir()))')" >> "$GITHUB_ENV"

      - name: Show versions
        run: |
          python --version
          ffmpeg -version | head -n 1
          streamlink --version

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . --verbose

  package:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  windows-host:
    name: compile VODPipeline.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the Windows host
        run: .\packaging\build.cmd
        shell: cmd
      - uses: actions/upload-artifact@v5
        with:
          name: VODPipeline-exe
          path: VODPipeline.exe
